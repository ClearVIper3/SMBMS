# 前端 SPA 容器内的 nginx 配置
# - / -> 静态文件，找不到时回落到 index.html（hash 路由其实不需要，但 history 模式需要）
# - /api/** -> 反代到后端容器（容器名 app，端口 8080，contextPath /smbms）

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://app:8080/smbms/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization $http_authorization;
        proxy_read_timeout 600s;        # SSE 长连接，加长读超时
        proxy_buffering    off;          # 关闭缓冲，token 才能实时下发
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
