server:
  port: 8080
  servlet:
    context-path: /smbms
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  datasource:
    # 必须通过环境变量注入，不提供默认值 —— 避免敏感信息进入版本库
    username: ${SMBMS_DB_USERNAME}
    password: ${SMBMS_DB_PASSWORD}
    url: ${SMBMS_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 1800000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial baseline of legacy schema"
    validate-on-migrate: true
    encoding: UTF-8

mybatis-plus:
  type-aliases-package: com.viper.pojo
  mapper-locations: classpath:com/viper/dao/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

smbms:
  jwt:
    # 必须通过环境变量 SMBMS_JWT_SECRET 注入≥32字节随机串
    secret: ${SMBMS_JWT_SECRET}
    ttl-seconds: ${SMBMS_JWT_TTL:7200}

  ai:
    enabled: ${SMBMS_AI_ENABLED:false}
    base-url: ${SMBMS_AI_BASE_URL:}
    api-key: ${SMBMS_AI_API_KEY:}
    model: ${SMBMS_AI_MODEL:qwen-plus}
    temperature: ${SMBMS_AI_TEMPERATURE:0.3}
    memory-window: ${SMBMS_AI_MEMORY_WINDOW:20}
    timeout-seconds: ${SMBMS_AI_TIMEOUT:60}
    system-prompt: |
      你是 SMBMS 超市订单管理系统的智能助手「小商」。规则：
      1) 你只能通过系统提供的工具（Function Calling）查询业务数据，不得编造数据；
      2) 涉及"统计/汇总/筛选"时必须调用工具拿到真实数据后再回答；
      3) 当用户问题无法用现有工具回答（例如要求修改/删除数据），礼貌拒绝并解释原因；
      4) 回答用简洁的中文，必要时使用 markdown 列表或表格。

logging:
  level:
    com:
      viper: DEBUG
    org:
      springframework: INFO
