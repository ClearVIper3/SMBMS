server:
  port: 8080
  servlet:
    context-path: /smbms
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  datasource:
    # 敏感配置外置：优先读环境变量，本地无环境变量时回落到默认值，保持零配置启动体验
    username: ${SMBMS_DB_USERNAME:root}
    password: ${SMBMS_DB_PASSWORD:123456}
    url: ${SMBMS_DB_URL:jdbc:mysql://localhost:3306/smbms?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 1800000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # 关闭 SB 自带 schema/data.sql 自动执行：Flyway 接管数据库初始化
  sql:
    init:
      mode: never

  # Flyway 配置：
  #   - baseline-on-migrate=true：若库里已有表（即"现网库"）但无 flyway_schema_history，
  #     则不重跑 V1 基线，直接把当前状态标记为 baseline-version；这是不丢历史数据的关键。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial baseline of legacy schema"
    validate-on-migrate: true
    encoding: UTF-8

mybatis-plus:
  type-aliases-package: com.viper.pojo
  mapper-locations: classpath:com/viper/dao/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

smbms:
  jwt:
    # 生产必须通过环境变量 SMBMS_JWT_SECRET 注入≥32字节随机串；默认值仅供本地开发
    secret: ${SMBMS_JWT_SECRET:please-change-this-very-long-dev-only-secret-key-32+bytes}
    ttl-seconds: ${SMBMS_JWT_TTL:7200}

  # AI 助手配置（走 OpenAI 兼容协议，默认指向阿里云 DashScope 通义千问，可换 DeepSeek/Moonshot/OpenAI）
  ai:
    enabled: ${SMBMS_AI_ENABLED:true}
    base-url: ${SMBMS_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${SMBMS_AI_API_KEY:}
    model:   ${SMBMS_AI_MODEL:qwen-plus}
    temperature: ${SMBMS_AI_TEMPERATURE:0.3}
    # 单次会话最多保留多少条历史消息进入上下文（按消息条数滑动窗口，省 token）
    memory-window: ${SMBMS_AI_MEMORY_WINDOW:20}
    timeout-seconds: ${SMBMS_AI_TIMEOUT:60}
    # 系统提示词：明确身份/能力边界/工具使用规则
    system-prompt: |
      你是 SMBMS 超市订单管理系统的智能助手「小商」。规则：
      1) 你只能通过系统提供的工具（Function Calling）查询业务数据，不得编造数据；
      2) 涉及"统计/汇总/筛选"时必须调用工具拿到真实数据后再回答；
      3) 当用户问题无法用现有工具回答（例如要求修改/删除数据），礼貌拒绝并解释原因；
      4) 回答用简洁的中文，必要时使用 markdown 列表或表格。

logging:
  level:
    com:
      viper: DEBUG
    org:
      springframework: INFO
