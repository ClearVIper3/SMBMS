<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head}">
</head>
<body>
<div th:replace="~{common/head :: body}"></div>

<div class="right">
    <div class="location">
        <strong>你现在所在的位置是:</strong>
        <span>订单管理页面 >> 订单添加页面</span>
    </div>
    <div class="providerAdd">
        <!-- 后端错误提示：订单编码重复、供应商不存在等 -->
        <div th:if="${error}" style="color:#fff;background:#e74c3c;padding:10px 15px;margin:10px 0;border-radius:4px;">
            <strong>提示：</strong><span th:text="${error}"></span>
        </div>
        <form id="billForm" name="billForm" method="post" th:action="@{/bill/add}">
            <!--div的class 为error是验证错误，ok是验证成功-->
            <div class="">
                <label for="billCode">订单编码：</label>
                <input type="text" name="billCode" class="text" id="billCode" th:value="${bill != null} ? ${bill.billCode} : ''">
                <!-- 放置提示信息 -->
                <font color="red"></font>
            </div>
            <div>
                <label for="productName">商品名称：</label>
                <input type="text" name="productName" id="productName" th:value="${bill != null} ? ${bill.productName} : ''">
                <font color="red"></font>
            </div>
            <div>
                <label for="productUnit">商品单位：</label>
                <input type="text" name="productUnit" id="productUnit" th:value="${bill != null} ? ${bill.productUnit} : ''">
                <font color="red"></font>
            </div>
            <div>
                <label for="productCount">商品数量：</label>
                <input type="text" name="productCount" id="productCount" th:value="${bill != null} ? ${bill.productCount} : ''">
                <font color="red"></font>
            </div>
            <div>
                <label for="totalPrice">总金额：</label>
                <input type="text" name="totalPrice" id="totalPrice" th:value="${bill != null} ? ${bill.totalPrice} : ''">
                <font color="red"></font>
            </div>
            <div>
                <label>供应商：</label>
                <select name="providerId" id="providerId">
                </select>
                <font color="red"></font>
            </div>
            <div>
                <label>是否付款：</label>
                <input type="radio" name="isPayment" value="1" checked="checked">未付款
                <input type="radio" name="isPayment" value="2">已付款
            </div>
            <div class="providerAddBtn">
                <input type="button" name="add" id="add" value="保存">
                <input type="button" id="back" name="back" value="返回">
            </div>
        </form>
    </div>
</div>
</section>
<div th:replace="~{common/foot :: body}"></div>
<script type="text/javascript">
	// 确保path变量在使用billadd.js之前已定义
	if (typeof path === 'undefined') {
		var path = $("#path").val();
		if (path && path.endsWith('/')) {
			path = path.slice(0, -1);
		}
	}
</script>
<script type="text/javascript" th:src="@{/js/billadd.js}"></script>
</body>
</html>
